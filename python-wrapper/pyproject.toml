[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo2buddy-wrapper"
version = "0.2.0"
description = "Python API wrapper / CLI for AlphaSmart Neo2 Buddy (local web portal)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neo2 Buddy" }]
dependencies = [
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
# Short CLI name; package import is neo2buddy_wrapper
neo2buddy = "neo2buddy_wrapper.__main__:main"
neo2buddy-wrapper = "neo2buddy_wrapper.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neo2buddy_wrapper*"]
