[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo2buddy-flasher"
version = "1.0.0"
description = "Simple GUI flasher for Neo2 Buddy (ESP32-S3) — no ESP-IDF required"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Neo2 Buddy" }]
dependencies = [
  "esptool>=4.7,<5",
  "pyserial>=3.5",
]

[project.scripts]
neo2buddy-flash = "neo2buddy_flasher.app:main"
neo2buddy-build = "neo2buddy_flasher.builder_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neo2buddy_flasher*"]
