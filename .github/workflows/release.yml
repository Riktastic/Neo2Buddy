# Publish GitHub Release assets:
# - Setup-windows-<ver>.zip  (Neo2BuddySetup.exe — no Python)
# - Setup-macos-<ver>.zip    (Neo2BuddySetup.app)
# - Setup-linux-<ver>.zip    (Neo2BuddySetup binary)
# GitHub also attaches Source code (zip / tar.gz) for the tag.
#
# Builds native Setup apps from firmware images in releases/<version>/.

name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

  native:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tk
        if: matrix.artifact == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Stage flasher + images
        shell: bash
        run: |
          V="${{ needs.resolve.outputs.version }}"
          IMG="releases/$V"
          test -f "$IMG/littlefs.bin"
          STAGE="flasher/_native_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/images"
          cp -R flasher/neo2buddy_flasher "$STAGE/"
          cp flasher/run_setup.py flasher/neo2buddy_setup.spec "$STAGE/"
          cp "$IMG/bootloader.bin" "$IMG/partition-table.bin" \
             "$IMG/alpha_smart_neo2_buddy.bin" "$IMG/littlefs.bin" "$STAGE/images/"

      - name: Build with PyInstaller
        shell: bash
        working-directory: flasher/_native_stage
        run: |
          python -m pip install -U pip
          python -m pip install "pyinstaller>=6.3" -r ../requirements.txt
          python -m PyInstaller --noconfirm neo2buddy_setup.spec

      - name: Package Windows zip
        if: matrix.artifact == 'windows'
        shell: bash
        run: |
          V="${{ needs.resolve.outputs.version }}"
          DIST="flasher/_native_stage/dist/Neo2BuddySetup"
          echo "Neo2 Buddy Setup $V (Windows)" > "$DIST/README.txt"
          echo "Unzip, then run Neo2BuddySetup.exe. No extra software to install." >> "$DIST/README.txt"
          mkdir -p "releases/$V"
          (cd "flasher/_native_stage/dist" && zip -r "$GITHUB_WORKSPACE/releases/$V/Setup-windows-$V.zip" Neo2BuddySetup)

      - name: Package macOS zip
        if: matrix.artifact == 'macos'
        shell: bash
        run: |
          V="${{ needs.resolve.outputs.version }}"
          APP="flasher/_native_stage/dist/Neo2BuddySetup.app"
          test -d "$APP"
          mkdir -p "releases/$V"
          (cd "flasher/_native_stage/dist" && zip -r "$GITHUB_WORKSPACE/releases/$V/Setup-macos-$V.zip" Neo2BuddySetup.app)

      - name: Package Linux zip
        if: matrix.artifact == 'linux'
        shell: bash
        run: |
          V="${{ needs.resolve.outputs.version }}"
          DIST="flasher/_native_stage/dist/Neo2BuddySetup"
          echo "Neo2 Buddy Setup $V (Linux)" > "$DIST/README.txt"
          echo "Unzip, then run ./Neo2BuddySetup. No extra software to install." >> "$DIST/README.txt"
          mkdir -p "releases/$V"
          (cd "flasher/_native_stage/dist" && zip -r "$GITHUB_WORKSPACE/releases/$V/Setup-linux-$V.zip" Neo2BuddySetup)

      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.artifact }}
          path: releases/${{ needs.resolve.outputs.version }}/Setup-${{ matrix.artifact }}-*.zip

  release:
    needs: [resolve, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: _native_out

      - name: Collect release files
        id: assets
        shell: bash
        run: |
          V="${{ needs.resolve.outputs.version }}"
          DIR="releases/$V"
          mkdir -p "$DIR"
          find _native_out -name 'Setup-*.zip' -exec cp {} "$DIR/" \;
          ls -la "$DIR"
          COUNT=$(find "$DIR" -maxdepth 1 -name 'Setup-*.zip' | wc -l)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No Setup-*.zip artifacts found."
            exit 1
          fi
          {
            echo "files<<EOF"
            ls -1 "$DIR"/Setup-*.zip
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Neo2 Buddy ${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install firmware

            Download **Setup** for your computer. Unzip and run it — **no Python, no ESP-IDF.** The app shows how to put the ESP32 in download mode and installs the firmware.

            | Download | What to run |
            |----------|-------------|
            | `Setup-windows-${{ needs.resolve.outputs.version }}.zip` | `Neo2BuddySetup.exe` |
            | `Setup-macos-${{ needs.resolve.outputs.version }}.zip` | `Neo2BuddySetup.app` (right-click → Open the first time) |
            | `Setup-linux-${{ needs.resolve.outputs.version }}.zip` | `./Neo2BuddySetup` |

            GitHub also attaches **Source code** (zip / tar.gz) for this tag.

            After install: join the Buddy Wi‑Fi hotspot and open http://192.168.4.1/

            Docs: https://github.com/Riktastic/Neo2Buddy · Demo: https://riktastic.github.io/Neo2Buddy/
          files: ${{ steps.assets.outputs.files }}
